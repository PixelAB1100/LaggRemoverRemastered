name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]  # 明确指定触发分支[3](@ref)
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # 升级 checkout 版本[3](@ref)
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4  # 升级 setup-java 版本[3](@ref)
        with:
          distribution: 'temurin'     # 推荐使用 Temurin 发行版[2](@ref)
          java-version: '17'         # 建议升级到 LTS 版本[3](@ref)
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3  # 添加 Gradle 环境设置[2](@ref)
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}

      - name: Grant gradlew permissions
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew --no-daemon build --stacktrace --info  # 添加调试参数[4](@ref)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/libs/*.jar
            build/reports/**/*.html
